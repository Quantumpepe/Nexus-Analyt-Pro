name: Restore original backend line endings on fix branch
on:
  push:
    branches: [fix/compare-asset-identity-20261122]
    paths: [.github/workflows/restore-backend-line-endings.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve source formatting and inspect actual diff
        shell: bash
        run: |
          git fetch --depth 1 origin main
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          old=subprocess.check_output(["git","show","FETCH_HEAD:app.py"])
          path=Path("app.py")
          new=path.read_bytes()
          old_crlf=old.count(b"\r\n")
          old_lf=old.count(b"\n")
          print(f"main original CRLF={old_crlf} total LF={old_lf}")
          if old_crlf>old_lf//2:
              restored=new.replace(b"\r\n",b"\n").replace(b"\n",b"\r\n")
              path.write_bytes(restored)
          print(f"current CRLF={path.read_bytes().count(bytes([13,10]))}")
          PY
          python3 -m py_compile app.py
          git diff --numstat FETCH_HEAD -- app.py
      - name: Commit preserved format
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m "Preserve original app.py line endings in Compare fix"
            git push origin HEAD:fix/compare-asset-identity-20261122
          fi
